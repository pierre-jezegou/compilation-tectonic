name: 'Build LaTex Document'

on:
  push:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      #Checks-out the repository
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      #Enable cache
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-
      
      # Setup tectonic
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@8a63d072f8390efdff59da7fa08aa49e3c1f5e1b # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          #tectonic-version: 0.14.1
      
      # Run tectonic to compile document
      - name: Compile TeX file
        run: tectonic main.tex
      
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF file
          path: main.pdf
          if-no-files-found: error
          retention-days: 5

      # Upload pdf file in GitHub release
      - if: ${{ github.event_name == 'release'}}
        name: Upload pdf to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: main.pdf
          asset_name: main.pdf
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
          body: "PDF compiled from source"
